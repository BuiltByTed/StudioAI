name: Homeframe UI
on:
  push:
    branches: [homeframe]
    paths: ['homeframe-ui/**', '.github/workflows/homeframe-ui.yml']
  pull_request:
    paths: ['homeframe-ui/**', '.github/workflows/homeframe-ui.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homeframe-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: homeframe-ui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: homeframe-browser-results
          path: homeframe-ui/test-results/
          retention-days: 7
