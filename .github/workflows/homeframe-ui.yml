name: Studio AI original interface
on:
  push:
    branches: [homeframe]
    paths: ['src/**', 'static/**', 'homeframe-bridge/**', 'homeframe-ui/deploy/**', 'package*.json', '*.config.*', '.github/workflows/homeframe-ui.yml']
  pull_request:
    paths: ['src/**', 'static/**', 'homeframe-bridge/**', 'homeframe-ui/deploy/**', 'package*.json', '*.config.*', '.github/workflows/homeframe-ui.yml']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - run: npm run crypto:verify
      - run: npx vite build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: homeframe-bridge/package-lock.json
      - run: npm ci
        working-directory: homeframe-bridge
      - run: npm test && npm run build && npm run doctor
        working-directory: homeframe-bridge
      - uses: actions/upload-artifact@v4
        with:
          name: studio-ai-original-interface
          path: homeframe-bridge/dist/
          retention-days: 7
