name: StudioAISimulatorTests
options:
  bundleIdPrefix: net.builtbyted.studioai.qa
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  StudioAITestHost:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.builtbyted.studioai.qa.host
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  StudioAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: StudioAITestHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.builtbyted.studioai.qa.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: StudioAITestHost
schemes:
  StudioAISimulatorTests:
    build:
      targets:
        StudioAITestHost: all
        StudioAIUITests: [test]
    test:
      targets: [StudioAIUITests]
      environmentVariables:
        STUDIO_TEST_URL: '$(STUDIO_TEST_URL)'
        STUDIO_TEST_ACCOUNT_FILE: '$(STUDIO_TEST_ACCOUNT_FILE)'
